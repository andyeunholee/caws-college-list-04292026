name: Keepalive (prevent 60-day cron auto-disable)

# GitHub disables scheduled workflows after 60 days without repository
# activity. This job makes one empty commit a month so the survey worker's
# cron never gets switched off.

on:
  schedule:
    - cron: "17 3 1 * *"   # 1st of every month, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Empty commit to keep the repository active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive $(date -u +%Y-%m-%d) — keeps scheduled workflows enabled"
          git push
